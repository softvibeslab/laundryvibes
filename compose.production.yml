name: laundryvibes

services:
  mongo:
    image: mongo:8.0
    container_name: laundryvibes-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set in secrets/production.env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set in secrets/production.env}
      MONGO_INITDB_DATABASE: laundryvibes
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?set in secrets/production.env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set in secrets/production.env}
    volumes:
      - laundryvibes_mongo_data:/data/db
      - ./deploy/mongo-init/01-create-app-user.sh:/docker-entrypoint-initdb.d/01-create-app-user.sh:ro
    networks: [laundryvibes_internal]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand({ping:1})' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 200
    security_opt: [no-new-privileges:true]

  backend:
    build:
      context: ./BACKEND
    image: laundryvibes-backend:local
    container_name: laundryvibes-backend
    restart: unless-stopped
    env_file: ./secrets/production.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:5050:3000"
    networks: [laundryvibes_internal, laundryvibes_egress]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 384m
    cpus: 0.75
    pids_limit: 100
    security_opt: [no-new-privileges:true]

  frontend:
    build:
      context: ./Frontend
    image: laundryvibes-frontend:local
    container_name: laundryvibes-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5080:8080"
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 50
    security_opt: [no-new-privileges:true]

networks:
  laundryvibes_internal:
    name: laundryvibes_internal
    internal: true
  laundryvibes_egress:
    name: laundryvibes_egress

volumes:
  laundryvibes_mongo_data:
    name: laundryvibes_mongo_data
