# Initial HTTP configuration. Install only after DNS points to this VPS.
upstream laundryvibes_frontend { server 127.0.0.1:5080; }
upstream laundryvibes_backend { server 127.0.0.1:5050; }

server {
  listen 80;
  listen [::]:80;
  server_name laundryvibes.rovicrm.com;
  client_max_body_size 100k;

  location /api/ {
    proxy_pass http://laundryvibes_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /socket.io/ {
    proxy_pass http://laundryvibes_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location / {
    proxy_pass http://laundryvibes_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
