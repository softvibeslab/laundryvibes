# Example only: copy/review manually; this repository never installs Nginx.
upstream laundryvibes_frontend { server 127.0.0.1:5080; }
upstream laundryvibes_backend { server 127.0.0.1:5050; }

server {
  listen 443 ssl http2;
  server_name laundry.example.com;
  client_max_body_size 100k;

  location /api/ {
    proxy_pass http://laundryvibes_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /socket.io/ {
    proxy_pass http://laundryvibes_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
  location / { proxy_pass http://laundryvibes_frontend; proxy_set_header Host $host; }
}
