map $request_uri $laundry_robots_tag {
  default "noindex, nofollow, noarchive";
  ~^/(?:\?.*)?$ "";
  ~^/(?:robots\.txt|sitemap\.xml|llms\.txt|site\.webmanifest|favicon\.ico|favicon-32x32\.png|apple-touch-icon\.png)(?:\?.*)?$ "";
  ~^/(?:assets|brand)/ "";
  ~\.(?:css|js|png|jpe?g|webp|svg|ico|woff2?)(?:\?.*)?$ "";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header X-Robots-Tag $laundry_robots_tag always;

  location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
  location ~ ^/(?:login/?$|registration/?$|forgot-password/?$|access/?$|workerdashboard/?$|stock/?$|reset-password(?:/|$)|user(?:/|$)|worker(?:/|$)|admin(?:/|$)) {
    try_files $uri $uri/ /index.html;
  }
  location = / { try_files /index.html =404; }
  location / { try_files $uri $uri/ =404; }
}
